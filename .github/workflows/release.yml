name: Release binaries

on:
  push:
    tags: ["v5*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos_arm
          - runner: macos-14
            target: macos_intel
          - runner: ubuntu-22.04
            target: linux
          - runner: ubuntu-22.04
            target: windows

    env:
      MIX_ENV: prod
      BURRITO_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install packaging tools (linux/windows targets)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xz-utils p7zip-full

      - run: mix deps.get --only prod
      - run: mix assets.setup
      - run: mix assets.deploy
      - run: mix release csv2sql

      - uses: actions/upload-artifact@v4
        with:
          name: csv2sql-${{ matrix.target }}
          path: burrito_out/*
          if-no-files-found: error
